name: Test

on: 
  push:

jobs:
  test:
    name: '${{ matrix.os }}, py${{ matrix.python-version }}, fastdss=${{ matrix.fastdss }}'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-24.04-arm, ubuntu-latest, windows-latest, macos-15-intel, macos-latest]
        fastdss: [0, 1]

    runs-on: ${{ matrix.os }}
    steps: 
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas matplotlib pytest
          git fetch --unshallow
          python -m pip install .[extras]

      - name: Run tests (NumPy)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set OPENDSSDIRECT_PY_USE_NUMPY=1
          set DSS_EXTENSIONS_FASTDSS=${{ matrix.fastdss }}
          pytest -vv

      - name: Run tests (lists)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set OPENDSSDIRECT_PY_USE_NUMPY=0
          set DSS_EXTENSIONS_FASTDSS=${{ matrix.fastdss }}
          pytest -vv

      - name: Run tests (NumPy)
        if: runner.os != 'Windows'
        run: |
          OPENDSSDIRECT_PY_USE_NUMPY=1 DSS_EXTENSIONS_FASTDSS=${{ matrix.fastdss }} pytest -vv
          pytest -vv

      - name: Run tests (lists)
        if: runner.os != 'Windows'
        run: |
          OPENDSSDIRECT_PY_USE_NUMPY=0 DSS_EXTENSIONS_FASTDSS=${{ matrix.fastdss }} pytest -vv
          pytest -vv

      - name: Run tests (NumPy/debug)
        if: runner.os == 'Linux'
        run: |
          OPENDSSDIRECT_PY_USE_NUMPY=1 DSS_EXTENSIONS_FASTDSS=${{ matrix.fastdss }} DSS_EXTENSIONS_DEBUG=1 pytest -vv
          pytest -vv

      - name: Run tests (lists/debug)
        if: runner.os == 'Linux'
        run: |
          OPENDSSDIRECT_PY_USE_NUMPY=1 DSS_EXTENSIONS_FASTDSS=${{ matrix.fastdss }} DSS_EXTENSIONS_DEBUG=1 pytest -vv
          pytest -vv
